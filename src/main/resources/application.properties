spring.application.name=student-login-crud
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_login_crud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jj312312}
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=org.example.studentlogincrud.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
app.admin.access-passphrase=${ADMIN_ACCESS_PASSPHRASE:rjbzx11}

# Set APP_PUBLIC_BASE_URL to the LAN IP or production domain used by mobile phones.
app.public-base-url=${APP_PUBLIC_BASE_URL:}

# ===================== OJ 爬虫配置 =====================
# contest-id 留空 = 爬虫关闭（查分走数据库分数）
oj.base-url=${OJ_BASE_URL:https://oj.dsstudio.tech}
oj.contest-id=${OJ_CONTEST_ID:}
oj.contest-password=${OJ_CONTEST_PASSWORD:}
# 登录 OJ 后的 Cookie（浏览器 F12 复制），格式：sessionid=xxx; csrftoken=xxx
oj.session-cookie=${OJ_SESSION_COOKIE:}
