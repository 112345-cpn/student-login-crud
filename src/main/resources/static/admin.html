<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 新生招募系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#182230;font-family:"Noto Sans SC",sans-serif}.card{width:min(520px,calc(100% - 44px));padding:42px;border:1px solid #e8ecf2;border-radius:18px;background:#fff;box-shadow:0 20px 55px rgba(25,40,60,.08)}h1{margin:0 0 10px;font-size:28px}p{color:#8993a5;font-size:14px}.logout{margin-top:22px;padding:11px 18px;border:0;border-radius:8px;color:#fff;background:#ff674f;cursor:pointer}</style>
</head>
<body><section class="card"><h1>欢迎进入管理后台</h1><p id="welcome">正在读取管理员信息…</p><button class="logout" id="logout">退出登录</button></section><script>const token=localStorage.getItem('adminToken');if(!token){location.href='/';}const info=JSON.parse(localStorage.getItem('adminInfo')||'{}');document.querySelector('#welcome').textContent=`你好，${info.username||'管理员'}。登录状态有效。`;document.querySelector('#logout').onclick=async()=>{try{await fetch('/api/admin/logout',{method:'POST',headers:{Authorization:`Bearer ${token}`}})}finally{localStorage.removeItem('adminToken');localStorage.removeItem('adminInfo');location.href='/';}};</script></body>
</html>
