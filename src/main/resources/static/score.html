<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1b2838" />
  <title>成绩查询 · 新生招募系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css?v=202608131712" />
  <style>
    .score-header {
      position: relative;
      overflow: hidden;
      padding: clamp(40px, 8vw, 72px) 28px;
      color: #fff;
      background: #1b2838;
      isolation: isolate;
    }
    .score-header::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: radial-gradient(circle at 78% 30%, rgba(255, 111, 89, .28), transparent 28%),
                  radial-gradient(circle at 10% 90%, rgba(65, 122, 198, .22), transparent 34%),
                  linear-gradient(135deg, #1b2838, #131e2b 75%);
    }
    .score-header::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 300px;
      height: 300px;
      right: -130px;
      top: -120px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      box-shadow: 0 0 0 38px rgba(255,255,255,.025), 0 0 0 76px rgba(255,255,255,.018);
    }
    .score-header .brand-mark { margin-bottom: 22px; }
    .score-header h1 { margin: 12px 0 6px; font-size: 28px; letter-spacing: -.045em; }
    .score-header p { margin: 0; color: rgba(255,255,255,.55); font-size: 12px; letter-spacing: .06em; }
    .score-main { padding: 28px 20px 44px; }
    .score-card {
      max-width: 420px;
      margin: -46px auto 0;
      padding: 34px 30px 30px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 18px 45px rgba(20, 35, 55, .12);
      text-align: center;
      position: relative;
    }
    .score-card .eyebrow { margin-bottom: 10px; }
    .score-card h2 { margin: 0 0 6px; font-size: 25px; letter-spacing: -.03em; }
    .score-student-no { margin: 0 0 26px; color: #8993a5; font-size: 13px; }
    .score-student-no span { color: #435064; font-weight: 600; }
    .score-value {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      padding: 22px 0 20px;
      border-top: 1px dashed #e8ecf2;
      border-bottom: 1px dashed #e8ecf2;
    }
    .score-value span {
      color: var(--accent);
      font: 700 56px/1 "DM Sans", sans-serif;
      letter-spacing: -.04em;
    }
    .score-value small { color: #8993a5; font-size: 14px; }
    .score-status { min-height: 20px; margin: 18px 0 0; color: #7c8797; font-size: 12px; }
    .score-status.error { color: #dd4c3a; }
    .score-footer { margin: 0 0 34px; color: #c6ccd5; text-align: center; font: 10px "DM Sans", sans-serif; letter-spacing: .05em; }
    @media (max-width: 420px) {
      .score-card { padding: 28px 20px 24px; }
      .score-value span { font-size: 48px; }
    }
  </style>
</head>
<body>
  <header class="score-header">
    <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="eyebrow">SCORE QUERY</p>
    <h1>新生招募系统</h1>
    <p>扫码查询你的考核成绩</p>
  </header>

  <main class="score-main">
    <section class="score-card" aria-label="成绩信息">
      <p class="eyebrow">SCORE CARD</p>
      <h2 id="studentName">—</h2>
      <p class="score-student-no">学号 <span id="studentNo">—</span></p>
      <div class="score-value">
        <span id="score">—</span>
        <small>分</small>
      </div>
      <p class="score-status" id="statusMessage">正在查询成绩…</p>
    </section>
  </main>

  <p class="score-footer">Student Recruitment System &nbsp;•&nbsp; 2026</p>

  <script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var publicId = params.get('publicId');
    var nameEl = document.getElementById('studentName');
    var noEl = document.getElementById('studentNo');
    var scoreEl = document.getElementById('score');
    var statusEl = document.getElementById('statusMessage');

    if (!publicId) {
      statusEl.textContent = '链接缺少查询参数';
      statusEl.className = 'score-status error';
      return;
    }

    fetch('/api/public/scores/' + encodeURIComponent(publicId))
      .then(function(res) { return res.json(); })
      .then(function(result) {
        if (result.code === 200) {
          nameEl.textContent = result.data.name;
          noEl.textContent = result.data.studentNo;
          scoreEl.textContent = result.data.score == null ? '未录入' : result.data.score;
          statusEl.textContent = '';
        } else {
          scoreEl.textContent = '—';
          statusEl.textContent = result.message || '查询失败';
          statusEl.className = 'score-status error';
        }
      })
      .catch(function() {
        scoreEl.textContent = '—';
        statusEl.textContent = '网络错误，请重试';
        statusEl.className = 'score-status error';
      });
  })();
  </script>
</body>
</html>
